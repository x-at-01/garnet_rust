[package]
name = "wedb_blocking"
version = "0.1.0"
edition = "2024"
license = "MulanPSL-2.0"
repository = "https://github.com/x-at-01/garnet_rust.git"
homepage = "https://github.com/x-at-01/garnet_rust/tree/main/wedb_blocking"
description = "wedb_blocking"
keywords = []
categories = []

[lints]
workspace = true

[features]
default = []

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
bytes = "1.12.1"
compio = { version = "0.19.2", features = ["runtime", "time"] }
crossfire = "3.1.20"
parking_lot = "0.12.5"
thiserror = "2.0.20"
whasher = { version = "0.1.0", path = "../../wedb_base/whasher" }
wedb_resp = { version = "0.1.0", path = "../wedb_resp" }

[dev-dependencies]
aok = "0.1.18"
ctor = "1.0.13"
log = "0.4.34"
log_init = "0.1.39"
