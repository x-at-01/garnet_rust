insights_title: "4. Technical Analysis"
insights:
  - "In-Place Updates: WeDB performs in-place updates in the HybridLog mutable region, without WAL append or compactions. LSM-Tree engines (RocksDB & Fjall) append updates to Memtable, triggering background compactions and write amplification."
  - "Point Reads: WeDB locates records via a 64B hash index in O(1) time complexity; WeDb-BfTree traverses nodes via paged memory cache; RocksDB and Fjall query Memtable, BloomFilter, and Block Cache."
  - "Concurrency: WeDB uses LightEpoch coordination where threads access independent sessions with atomic append; WeDb-BfTree uses striped locks; RocksDB is bounded by write mutex batching."
  - "Range Queries: all four engines use a unified raw-KV ordered scan methodology (WeDB drives its built-in BfTree raw KV scan directly, bypassing the ZSet upper layer); WeDb-BfTree benchmarks against Garnet BfTree block paging; RocksDB and Fjall support full lexicographical range scans."
  - "Space Amplification: LSM-Tree engines achieve space amplification below 1.0x via background tiered compaction and block compression; WeDB uses segmented log append with space amplification around 1.08x."
