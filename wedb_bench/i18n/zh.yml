insights_title: "4. 技术分析"
insights:
  - "就地更新: WeDB 在 HybridLog 可变区就地更新，不追加 WAL，无 Compaction；LSM-Tree（RocksDB 与 Fjall）追加 Memtable，触发后台 Compaction 与写放大。"
  - "点读定位: WeDB 通过 64B 哈希索引定位记录，时间复杂度 O(1)；WeDb-BfTree 通过内存页缓存检索 B 树节点；RocksDB 与 Fjall 需检索 Memtable、BloomFilter 与 Block Cache。"
  - "并发扩展: WeDB 基于 LightEpoch 协调，各线程使用独立 Session 与原子追加；WeDb-BfTree 采用条带锁并发；RocksDB 并发写入受互斥锁批处理限制。"
  - "范围查询: 四引擎统一纯 KV 有序扫描口径（WeDB 直接驱动底层 BfTree 原始 KV 扫描，不经 ZSet 上层路径）；WeDb-BfTree 对标 Garnet BfTree 块级分页，RocksDB 与 Fjall 支持全量持久化键字典序扫描。"
  - "空间占用: LSM-Tree 采用后台分层合并与块压缩，空间放大低于 1.0x；WeDB 采用分段日志追加，空间放大约 1.08x。"
