[package]
name = "wedb_cluster"
version = "0.1.0"
edition = "2024"
license = "MulanPSL-2.0"
repository = "https://github.com/x-at-01/garnet_rust.git"
homepage = "https://github.com/x-at-01/garnet_rust/tree/main/wedb_cluster"
description.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[features]
default = []

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
bitcode = "0.6.9"
coarsetime = "0.1.37"
fastrand = "2.5.0"
itoa = "1.0.18"
memchr = "2.8.3"
nested-text = "0.1.0"
parking_lot = "0.12.5"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.20"
whasher = { version = "0.1.0", path = "../../wedb_base/whasher" }

[dev-dependencies]
aok = "0.1.18"
ctor = "1.0.13"
log = "0.4.34"
log_init = "0.1.39"
tempfile = "3.27.0"
